[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "in-tui-tion"
dynamic = ["version"]
description = "A library for building rich, modern, first-class terminal user interfaces."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "stocklidevs" }]
keywords = ["tui", "terminal", "textual", "console", "agent", "dashboard", "ui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals",
    "Typing :: Typed",
]
dependencies = [
    "textual>=6,<7",
]

[project.urls]
Homepage = "https://github.com/stocklidevs/in-tui-tion"
Repository = "https://github.com/stocklidevs/in-tui-tion"

[project.scripts]
intui = "intui.console.cli:main"

[project.optional-dependencies]
metrics = ["psutil>=5"]

[tool.hatch.version]
path = "src/intui/__init__.py"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pytest-textual-snapshot>=1.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4",
    "psutil>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/intui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]  # makes the examples gallery importable in tests
# Project-local tmp base: the default %TEMP%/pytest-of-<user> dir can end up
# with broken ACLs on Windows, breaking the tmp_path fixture.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
line-length = 99
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Layer boundary (Constitution Principle II): the pipeline core is engine-free.
# Enforced for the whole package here; widgets/ and app.py are exempted below.
"textual".msg = "Only intui.widgets and intui.app may import the terminal engine."

[tool.ruff.lint.per-file-ignores]
"src/intui/widgets/**" = ["TID251"]
"src/intui/app.py" = ["TID251"]
# Kit components are layer-2 rendering code; intui/kit/state stays banned.
"src/intui/kit/__init__.py" = ["TID251"]
"src/intui/kit/chip.py" = ["TID251"]
"src/intui/kit/tree.py" = ["TID251"]
"src/intui/kit/lanes.py" = ["TID251"]
"src/intui/kit/command_bar.py" = ["TID251"]
"src/intui/kit/command_palette.py" = ["TID251"]
"src/intui/kit/diff_viewer.py" = ["TID251"]
"src/intui/kit/evidence_panel.py" = ["TID251"]
"src/intui/kit/file_tree.py" = ["TID251"]
"src/intui/kit/metrics_panel.py" = ["TID251"]
"src/intui/kit/mode_strip.py" = ["TID251"]
"src/intui/kit/conversation_log.py" = ["TID251"]
"src/intui/kit/prompt_input.py" = ["TID251"]
"src/intui/kit/activity_strip.py" = ["TID251"]
"src/intui/kit/view_router.py" = ["TID251"]
# The zero-config console runner is layer-2 rendering code (composes the kit).
"src/intui/console/app.py" = ["TID251"]
"tests/snapshot/**" = ["TID251"]
"tests/integration/**" = ["TID251"]
"tests/replay/test_responsiveness.py" = ["TID251"]  # drives a real app under load
"examples/**" = ["TID251"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/intui"]

[[tool.mypy.overrides]]
# Textual-facing modules: strict typing relaxed where the engine's
# dynamic APIs make it impractical.
module = ["intui.widgets.*", "intui.app"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
